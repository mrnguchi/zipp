name: Backend CI
on:
  pull_request:
  workflow_call:
    inputs:
      run_tests:
        description: Explicitly authorize tests, scans and load checks
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      run_tests:
        description: Explicitly authorize tests, scans and load checks
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:boundaries
      - run: npm run check:workflows
      - run: npm run build
      - name: Keep generated contracts synchronized
        run: |
          git ls-files --error-unmatch contracts/openapi.json contracts/identity-event.schema.json contracts/financial-payment-command.schema.json contracts/ride-event.schema.json contracts/ride-dispatch-command.schema.json contracts/delivery-event.schema.json contracts/delivery-dispatch-command.schema.json contracts/realtime-handshake.schema.json contracts/realtime-snapshot.schema.json contracts/realtime-error.schema.json contracts/communication-event.schema.json contracts/notification-command.schema.json contracts/call-event.schema.json contracts/operations-event.schema.json
          git diff --exit-code -- contracts
  authorized-tests:
    if: inputs.run_tests == true && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run prisma:generate
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run check:policies
      - run: npm run check:negative
      - run: npm run security:audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-report
          path: artifacts/npm-audit.json
          retention-days: 14
          if-no-files-found: ignore
  source-security:
    if: inputs.run_tests == true && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/.node-version
      - run: node backend/scripts/tooling.mjs secret-probe
      - run: node backend/scripts/tooling.mjs secrets
      - run: node backend/scripts/tooling.mjs workflows
      - run: node backend/scripts/tooling.mjs monitoring
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: redacted-secret-report
          path: artifacts/secrets.json
          retention-days: 7
          if-no-files-found: ignore
  services-and-image:
    if: inputs.run_tests == true && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/.node-version
      - run: npm run services:test
      - name: Repeat migration without schema reset
        run: docker compose -p zipp-m0-test -f ../infra/compose/compose.yaml -f ../infra/compose/compose.test.yaml run --rm migrate
      - run: node scripts/migration-gate.mjs
      - run: node scripts/load.mjs baseline
      - run: node scripts/load.mjs burst
      - run: node scripts/tooling.mjs image
      - run: node scripts/tooling.mjs sbom
      - name: Scan migration image
        env:
          ZIPP_SCAN_IMAGE: zipp-backend:local-migrate
          ZIPP_SCAN_REPORT: migration
        run: |
          node scripts/tooling.mjs image
          node scripts/tooling.mjs sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-security-reports
          path: |
            artifacts/runtime-vulnerabilities.json
            artifacts/runtime-sbom.json
            artifacts/migration-vulnerabilities.json
            artifacts/migration-sbom.json
            artifacts/load-*.txt
            backend/coverage/
          retention-days: 14
          if-no-files-found: ignore
      - run: npm run services:test:down
        if: always()
