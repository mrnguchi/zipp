name: Backend release
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Explicitly authorize the complete verification suite
        type: boolean
        required: false
        default: false
      publish_release:
        description: Explicitly authorize registry publishing after verification
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.run_tests == true && inputs.publish_release == true && vars.BACKEND_RELEASES_ENABLED == 'true'
    uses: ./.github/workflows/backend-ci.yml
    with:
      run_tests: true
  publish:
    if: github.ref == 'refs/heads/main' && inputs.run_tests == true && inputs.publish_release == true && vars.BACKEND_RELEASES_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive registry path
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/.node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: runtime
        with:
          context: backend
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: migration
        with:
          context: backend
          target: migration
          push: true
          tags: ${{ env.IMAGE }}-migrate:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan exact published candidates before release
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
        run: |
          export ZIPP_SCAN_IMAGE="$IMAGE@$RUNTIME_DIGEST" ZIPP_SCAN_REPORT=runtime
          docker pull "$ZIPP_SCAN_IMAGE"
          node backend/scripts/tooling.mjs image
          node backend/scripts/tooling.mjs sbom
          export ZIPP_SCAN_IMAGE="$IMAGE-migrate@$MIGRATION_DIGEST" ZIPP_SCAN_REPORT=migration
          docker pull "$ZIPP_SCAN_IMAGE"
          node backend/scripts/tooling.mjs image
          node backend/scripts/tooling.mjs sbom
      - name: Write immutable release manifest
        env:
          COMMIT: ${{ github.sha }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
        run: |
          node --input-type=module -e 'import{writeFileSync}from"node:fs";writeFileSync("release.json",JSON.stringify({schemaVersion:1,commit:process.env.COMMIT,runtime:process.env.IMAGE+"@"+process.env.RUNTIME_DIGEST,migration:process.env.IMAGE+"-migrate@"+process.env.MIGRATION_DIGEST},null,2))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-release-${{ github.sha }}
          path: release.json
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-security-reports
          path: |
            artifacts/*-vulnerabilities.json
            artifacts/*-sbom.json
          if-no-files-found: ignore
          retention-days: 14
