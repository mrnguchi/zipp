# OPTIONAL override for infra/compose/compose.yaml; API only, never worker.
# Requires reviewed prepared secret ownership and identified applied M7 schema.
services:
  api:
    environment:
      CALL_RELAY_CREDENTIALS_ENABLED: ${CALL_RELAY_CREDENTIALS_ENABLED:-false}
      CALL_RELAY_LAN_IP: ${ZIPP_TURN_LAN_IP:?Select the reviewed local relay listener}
      CALL_RELAY_SECRET_FILE: /run/secrets/call-relay-key
    secrets:
      - source: call-relay-key
        target: call-relay-key

secrets:
  # Paths resolve relative to the FIRST Compose file (infra/compose/compose.yaml).
  # Do not mount the full relay config or share identity keys with the relay.
  call-relay-key:
    file: ../calling/.local/turn-shared-secret
