# Always use a separate Compose project: -p zipp-m0-test. No shared development volumes.
services:
  postgres:
    environment:
      POSTGRES_DB: zipp_test
    ports: !override ["127.0.0.1:55433:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zipp_owner -d zipp_test"]
  migrate:
    environment:
      MIGRATION_DATABASE_URL: postgresql://zipp_owner:local_owner_only@postgres:5432/zipp_test
  api:
    ports: !override ["127.0.0.1:3100:3000"]
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://zipp_app:local_app_only@postgres:5432/zipp_test
  worker:
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://zipp_app:local_app_only@postgres:5432/zipp_test
  redis-queue:
    ports: !override ["127.0.0.1:56381:6379"]
  redis-cache:
    ports: !override ["127.0.0.1:56382:6379"]
  test:
    mem_limit: 768m
    cpus: 1
    volumes: [../../backend/coverage:/app/coverage]
    environment:
      NODE_OPTIONS: --max-old-space-size=512 --max-semi-space-size=8
      DATABASE_URL: postgresql://zipp_app:local_app_only@postgres:5432/zipp_test
